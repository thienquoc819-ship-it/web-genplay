<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNTH VN - Hệ Thống Lấy Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #0b0f19; 
            /* Tạo hiệu ứng lưới ô vuông */
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng ánh sáng xanh ở góc */
        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -20%;
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -20%;
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        /* Khung chính (Card) */
        .card { 
            background: rgba(15, 20, 30, 0.85); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0, 255, 204, 0.1);
            text-align: center;
            max-width: 420px; 
            width: 100%; 
            position: relative;
            z-index: 1;
        }

        /* Biểu tượng Avatar tròn */
        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #00ffcc, #0055ff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border: 3px solid #0b0f19;
            position: relative;
        }
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 15px;
            height: 15px;
            background-color: #00ff00;
            border-radius: 50%;
            border: 2px solid #0b0f19;
            box-shadow: 0 0 10px #00ff00;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; 
            color: #fff; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .subtitle {
            color: #00ffcc;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* Khung chứa Key */
        .key-box { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            position: relative;
        }
        
        .key-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .key-text { 
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; 
            font-weight: bold; 
            color: #ffcc00; 
            letter-spacing: 3px; 
            word-break: break-all; 
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }
        
        /* Nút bấm */
        .copy-btn { 
            background: linear-gradient(90deg, #00ffcc, #00b386); 
            color: #000; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            width: 100%;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        
        .copy-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.6);
        }
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .error { 
            color: #ff5555; 
            font-size: 18px; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.5);
        }
        
        .success-icon {
            font-size: 40px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Hiệu ứng hạt sáng bay lơ lửng */
        .particle {
            position: fixed;
            background: #00ffcc;
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            to { transform: translateY(-100vh); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            🚀
            <div class="status-dot"></div>
        </div>
        <h1>TNTH VN</h1>
        <div class="subtitle">HỆ THỐNG LẤY KEY TỰ ĐỘNG</div>
        
        <div id="content"><p style="color:#aaa;">Đang kết nối hệ thống...</p></div>
    </div>

    <script>
        // Hiệu ứng hạt sáng bay lên
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = '100vh';
            particle.style.width = Math.random() * 5 + 2 + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDuration = Math.random() * 5 + 3 + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.1;
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 8000);
        }
        setInterval(createParticle, 200);

        // Logic xử lý Token và Key
        const token = new URLSearchParams(window.location.search).get('token');
        const contentDiv = document.getElementById('content');

        if (!token) {
            contentDiv.innerHTML = '<p class="error">❌ Lỗi: Không tìm thấy Token!</p>';
        } else {
            function randomString(length) {
                let result = '';
                const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                for (let i = 0; i < length; i++) {
                    result += characters.charAt(Math.floor(Math.random() * characters.length));
                }
                return result;
            }
            
            const part1 = randomString(4);
            const part2 = randomString(4);
            const key = `TNTHVN-${part1}-${part2}`;

            // Hiệu ứng load chờ 1 xíu cho ngầu
            setTimeout(() => {
                contentDiv.innerHTML = `
                    <div class="success-icon">✅</div>
                    <p style="color: #00ffcc; font-weight: bold; font-size: 16px; margin-bottom: 20px;">Vượt link thành công!</p>
                    
                    <div class="key-box">
                        <span class="key-label">Mã Key Của Bạn</span>
                        <span class="key-text" id="keyText">${key}</span>
                    </div>
                    
                    <button class="copy-btn" onclick="copyKey()">📋 Sao Chép Key</button>
                    
                    <p style="font-size: 13px; color: #666; margin-top: 20px;">Quay lại Bot Telegram để nhập Key và nhận tiền.</p>
                `;
            }, 800);
        }

        function copyKey() {
            const keyText = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerHTML = '✅ Đã Copy!';
                btn.style.background = '#00ffcc';
                setTimeout(() => {
                    btn.innerHTML = '📋 Sao Chép Key';
                    btn.style.background = 'linear-gradient(90deg, #00ffcc, #00b386)';
                }, 2000);
            }).catch(err => {
                alert('Lỗi khi copy: ' + err);
            });
        }
    </script>
</body>
</html>
