<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Key GenPlay 835</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; text-align: center; padding: 50px; margin: 0; }
        .box { background: #2a2a40; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; width: 90%; }
        h1 { color: #00ffcc; font-size: 28px; margin-bottom: 20px; }
        .key-container { background: #111; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px dashed #00ffcc; }
        .key { font-size: 22px; font-weight: bold; color: #ffcc00; letter-spacing: 2px; word-break: break-all; }
        .copy-btn { background: #00ffcc; color: #111; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .copy-btn:hover { background: #00ccaa; }
        .error { color: #ff5555; font-size: 18px; }
        .success { color: #55ff55; font-size: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎮 GENPLAY 835</h1>
        <div id="content"><p>Đang kiểm tra...</p></div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const contentDiv = document.getElementById('content');

        if (!token) {
            contentDiv.innerHTML = '<p class="error">❌ Lỗi: Không tìm thấy Token!</p>';
        } else {
            // Tạo key ngẫu nhiên chuẩn TNTHVN-XXXX-YYYY
            function randomString(length) {
                let result = '';
                const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                for (let i = 0; i < length; i++) {
                    result += characters.charAt(Math.floor(Math.random() * characters.length));
                }
                return result;
            }
            
            const part1 = randomString(4);
            const part2 = randomString(4);
            const key = `TNTHVN-${part1}-${part2}`;

            contentDiv.innerHTML = `
                <p class="success">✅ Vượt link thành công!</p>
                <p>Dưới đây là Key của bạn:</p>
                <div class="key-container">
                    <span class="key" id="keyText">${key}</span>
                    <br>
                    <button class="copy-btn" onclick="copyKey()">📋 Copy Key</button>
                </div>
                <p style="font-size: 14px; color: #aaa;">Hãy quay lại Bot Telegram và nhập Key này vào.</p>
            `;
        }

        function copyKey() {
            const keyText = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('✅ Đã copy Key! Hãy quay lại Telegram dán vào.');
            }).catch(err => {
                alert('Lỗi khi copy: ' + err);
            });
        }
    </script>
</body>
</html>
